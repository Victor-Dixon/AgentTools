[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-dreamos"
version = "0.1.0"
description = "Core utilities for Dream.OS multi-agent orchestration and swarm MCP tooling."
requires-python = ">=3.9"
authors = [{ name = "Dream.OS Contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ac_v2 = "tools.toolbelt.agent_coordinate_v2:main"
ac-v2 = "tools.toolbelt.agent_coordinate_v2:main"
ac2 = "tools.toolbelt.agent_coordinate_v2:main"
ac-adv = "tools.toolbelt.agent_coordinate_advanced:main"
ac-ci = "tools.toolbelt.agent_coordinate_ci_guard:main"
swarm-mcp-server = "swarm_mcp.server:main"
swarm-mcp-health = "swarm_mcp.healthcheck:main"
swarm-mcp-release-check = "swarm_mcp.release_check:main"
v2-consolidation = "swarm_mcp.v2_consolidation:main"
rover-start = "rover_cli:rover_start"
rover-status = "rover_cli:rover_status"
rover-resume = "rover_cli:rover_resume"
rover-paused = "rover_cli:rover_paused"
passdown = "dream_control.cli:main"
dreamcap = "dream_control.cli:main"
dreamevent = "dream_control.cli:main"
dreamscan = "dream_control.cli:main"
dreamvps = "dream_control.cli:main"
dreamrun = "dream_control.cli:main"
dreaminstall = "dream_control.cli:main"
dreamwire = "dream_control.cli:main"
dreamlane = "dream_control.cli:main"
brain-probe = "dream_control.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_mcp*", "agent_tools*", "tools*", "dream_control*"]

[tool.setuptools.py-modules]
py-modules = ["rover_cli"]
