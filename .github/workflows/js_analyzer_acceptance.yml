name: JS analyzer acceptance
on:
  pull_request:
    paths:
      - 'mcp_servers/code_quality_server.py'
      - 'tests/test_js_analyzer_acceptance.py'
      - 'tests/test_tools_v2_safe_execution_contract.py'
      - '.github/workflows/js_analyzer_acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v -s tests/test_js_analyzer_acceptance.py tests/test_tools_v2_safe_execution_contract.py -k 'js_dead_code or real_analyzer'
        env:
          AGENTTOOLS_JS_ANALYZER_ACCEPTANCE: '1'
