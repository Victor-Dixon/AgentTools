name: Artifact metadata acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/artifact_metadata_acceptance.yml'
      - 'tests/test_artifact_metadata_acceptance.py'
      - 'mcp_servers/cicd_helper_server.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Generate synthetic fixture
        run: printf 'dreamos-artifact-metadata-fixture-v1\n' > "${RUNNER_TEMP}/fixture.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dreamos-metadata-fixture
          path: ${{ runner.temp }}/fixture.txt
          retention-days: 1
          if-no-files-found: error
      - name: Verify existing adapter against live metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ACCEPTANCE_RUN_ID: ${{ github.run_id }}
        run: python -m pytest -q -s tests/test_artifact_metadata_acceptance.py
