name: PyPI First Release Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build release candidate
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'build>=1.0' 'twine>=6.0' hatchling
        python -m build
        python -m twine check dist/*

    - name: Install wheel in a fresh environment
      shell: bash
      run: |
        set -euo pipefail
        wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
        test -n "$wheel"

        python -m venv /tmp/agenttools-release-candidate
        /tmp/agenttools-release-candidate/bin/python -m pip install --upgrade pip
        /tmp/agenttools-release-candidate/bin/python -m pip install "$wheel"

        /tmp/agenttools-release-candidate/bin/python - <<'PY'
        from importlib import metadata
        import agent_tools
        import swarm_mcp

        expected_name = "we-are-swarm-agenttools"
        dist = metadata.distribution(expected_name)
        assert dist.metadata["Name"] == expected_name

        expected_entries = {
            "swarm",
            "swarm-messaging-server",
            "swarm-memory-server",
            "swarm-tasks-server",
            "swarm-control-server",
            "swarm-tools-server",
        }
        actual_entries = {
            ep.name for ep in dist.entry_points if ep.group == "console_scripts"
        }
        missing = expected_entries - actual_entries
        assert not missing, f"missing console entry points: {sorted(missing)}"

        print("RELEASE_CANDIDATE_IMPORT=PASS")
        print(f"RELEASE_CANDIDATE_DISTRIBUTION={expected_name}")
        print("RELEASE_CANDIDATE_ENTRY_POINTS=PASS")
        PY

        /tmp/agenttools-release-candidate/bin/swarm --help >/dev/null
        /tmp/agenttools-release-candidate/bin/python -m pip check
        echo "RELEASE_CANDIDATE_CLI=PASS"
        echo "RELEASE_CANDIDATE_PIP_CHECK=PASS"

    - name: Probe public PyPI project metadata
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import sys
        import urllib.error
        import urllib.request

        project = "we-are-swarm-agenttools"
        urls = [
            f"https://pypi.org/pypi/{project}/json",
            f"https://pypi.org/simple/{project}/",
        ]

        observed = []
        for url in urls:
            request = urllib.request.Request(
                url,
                headers={"User-Agent": "Victor-Dixon-AgentTools-release-preflight/1"},
            )
            try:
                with urllib.request.urlopen(request, timeout=20) as response:
                    code = response.status
            except urllib.error.HTTPError as exc:
                code = exc.code

            observed.append((url, code))
            print(f"PYPI_PROBE|{code}|{url}")

        unexpected = [item for item in observed if item[1] != 404]
        if unexpected:
            print("PYPI_PUBLIC_NAME_PROBE=FAIL_PRESENT_OR_UNEXPECTED")
            print(
                "A public project endpoint now exists or returned an unexpected status. "
                "Do not publish until ownership/identity is reviewed."
            )
            sys.exit(1)

        print("PYPI_PUBLIC_NAME_PROBE=PASS_NO_PUBLIC_PROJECT_METADATA")
        print(
            "NOTE=Public 404s do not prove account ownership or reservation; "
            "PyPI can have registered names without releases."
        )
        PY

    - name: First-release gate summary
      run: |
        echo "PYPI_FIRST_RELEASE_PREFLIGHT=PASS"
        echo "PUBLICATION_PERFORMED=NO"
        echo "NEXT=complete authenticated PyPI account/trusted-publisher gate before enabling publication"
