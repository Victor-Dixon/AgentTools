name: Mutation engine acceptance
on:
  pull_request:
    paths:
      - 'tests/test_mutmut_engine_acceptance.py'
      - '.github/workflows/mutation_acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' 'mutmut==2.4.5'
      - run: python -m pytest -s -v tests/test_mutmut_engine_acceptance.py
        env:
          AGENTTOOLS_MUTMUT_ACCEPTANCE: '1'
