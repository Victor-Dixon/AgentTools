name: Swarm CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # Keep this job id stable so any existing required-check configuration
  # continues to resolve while the blocking signal stays package-focused.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install package and build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip install 'build>=1.0' 'twine>=6.0'

    - name: Build and validate distribution
      run: |
        python -m build
        python -m twine check dist/*

    - name: Verify clean wheel install
      shell: bash
      run: |
        set -euo pipefail
        wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
        test -n "$wheel"

        python -m venv /tmp/swarm-wheel-venv
        /tmp/swarm-wheel-venv/bin/python -m pip install --upgrade pip
        /tmp/swarm-wheel-venv/bin/python -m pip install "$wheel"

        /tmp/swarm-wheel-venv/bin/python - <<'PY'
        from importlib import metadata
        import agent_tools
        import swarm_mcp

        dist = metadata.distribution("we-are-swarm-agenttools")
        assert dist.metadata["Name"] == "we-are-swarm-agenttools"

        expected = {
            "swarm",
            "swarm-messaging-server",
            "swarm-memory-server",
            "swarm-tasks-server",
            "swarm-control-server",
            "swarm-tools-server",
        }
        actual = {ep.name for ep in dist.entry_points if ep.group == "console_scripts"}
        missing = expected - actual
        assert not missing, f"missing console entry points: {sorted(missing)}"

        print("CLEAN_WHEEL_IMPORT=PASS")
        print("DISTRIBUTION_NAME=we-are-swarm-agenttools")
        print("CONSOLE_ENTRY_POINTS=PASS")
        PY

        /tmp/swarm-wheel-venv/bin/swarm --help >/dev/null
        /tmp/swarm-wheel-venv/bin/python -m pip check
        echo "CLEAN_WHEEL_CLI=PASS"
        echo "CLEAN_WHEEL_PIP_CHECK=PASS"

    - name: Package import smoke
      run: |
        python -c "import swarm_mcp; import agent_tools"

    - name: Run package and core engineering tests
      run: |
        python -m pytest -v \
          tests/compat/test_agenttools_bus_message_adapter_contract.py \
          tests/compat/test_agenttools_tool_adapter_characterization.py \
          tests/test_agent_dna.py \
          tests/test_conflict.py \
          tests/test_consensus.py \
          tests/test_domain_import_boundaries.py \
          tests/test_integration.py \
          tests/test_mcp_catalog.py \
          tests/test_mcp_servers.py \
          tests/test_project_artifact_contract.py \
          tests/test_stage4_features.py \
          tests/test_toolbelt.py \
          tests/test_tools_v2_registry_contract.py \
          tests/test_tools_v2_safe_execution_contract.py \
          tests/test_work_proof.py

  legacy-audit:
    name: Legacy repository audit (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install legacy audit dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip install pip-audit

    - name: Run complete legacy audit surface
      shell: bash
      run: |
        set +e
        status=0

        run_audit() {
          label="$1"
          shift
          echo "::group::$label"
          "$@"
          rc=$?
          echo "exit_code=$rc"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            status=1
          fi
        }

        run_audit "Full pytest suite" python -m pytest tests/ -v
        run_audit "Import healer coverage gate" python tools/swarm/tests/check_import_healer_coverage.py
        run_audit "Swarm security scan" python tools/cli.py --security-scan
        run_audit "Swarm import audit" python tools/cli.py --audit-imports

        exit "$status"

  publish-pypi:
    # First publication is deliberately fail-closed. An ordinary v* tag is not
    # publication authority. PYPI_RELEASE_ENABLED must be set to true only after
    # the documented account/preflight gate is complete.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_RELEASE_ENABLED == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build distribution
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'build>=1.0' 'twine>=6.0' hatchling
        python -m build
        python -m twine check dist/*

    - name: Publish with PyPI Trusted Publishing
      uses: pypa/gh-action-pypi-publish@release/v1
